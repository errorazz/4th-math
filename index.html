<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Matematikos Praktika – 4 klasė</title>

<style>
:root {
  --cell: 36px;
  --cell-font: 22px;
  --blue: #1a73e8;
  --ok: #1e8e3e;
  --bad: #d93025;
  --border: #dadce0;
  --bg: #f8f9fa;
}

@media (max-width: 480px) {
  :root {
    --cell: 30px;
    --cell-font: 18px;
  }
}

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: var(--bg);
}

.app {
  max-width: 400px;
  margin: auto;
  padding: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
}

.card {
  background: #fff;
  border-radius: 16px;
  border: 2px solid var(--border);
  padding: 16px;
  flex: 1 1 calc(50% - 20px);
  min-width: 300px;
  max-width: 480px; 
  box-sizing: border-box;
  overflow-x: auto;
}

.actions {
  width: 100%;
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 20px;
}

.card.correct { border-color: var(--ok); background: #e6f4ea; }
.card.incorrect { border-color: var(--bad); background: #fce8e6; }

h2 {
  margin: 0 0 12px;
  font-size: 16px;
  color: #555;
  text-transform: uppercase;
}

.controls {
  margin-bottom: 12px;
}

select {
  padding: 4px;
  border-radius: 4px;
  border: 1px solid var(--border);
  font-size: 14px;
  width: 100%;
}

.math {
  font-family: monospace;
  font-weight: bold;
}

.row {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  height: var(--cell); 
}

.cell, input {
  width: var(--cell);
  height: var(--cell);
  line-height: var(--cell);
  font-size: var(--cell-font);
  text-align: center;
  box-sizing: border-box;
  flex-shrink: 0;
}

.cell {
  display: flex;
  align-items: center;
  justify-content: center;
}

input {
  border: 1px solid #bbb;
  border-radius: 6px;
  color: var(--blue);
}

input:focus {
  outline: none;
  border: 2px solid var(--blue);
}

.vline {
  border-left: 3px solid #000;
  height: var(--cell);
  margin-left: 4px;
  margin-right: 4px;
}

.div-hline {
  border-top: 3px solid #000;
  width: calc(var(--cell) * 3);
  margin: 0;
}

.hline {
  border-top: 3px solid #000;
  width: calc(var(--cell) * 3);
  margin: 6px 0;
}

button {
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid var(--border);
  cursor: pointer;
}

.primary {
  background: var(--blue);
  color: #fff;
  border: none;
}

.math-column .row {
  justify-content: flex-end;
}

.div-hline {
  border-top: 3px solid #000;
  width: calc(var(--cell) * 4);
}

.mul-hline {
  border-top: 3px solid #000;
  width: 100%;
  margin: 4px 0;
}

.m-sign {
  width: var(--cell);
  display: flex;
  justify-content: center;
  font-weight: bold;
}
</style>
</head>

<body>
<div class="app">

  <div id="divCard" class="card">
    <h2>Dalyba kampu</h2>
    <div class="controls">
      <select id="divMode">
        <option value="random">Atsitiktinis daliklis</option>
        <option value="1digit">Daliklis: 1 skaitmuo (Lengvas)</option>
        <option value="2digits">Daliklis: 2 skaitmenys (Sunkus)</option>
      </select>
    </div>
    <div id="division" class="math"></div>
  </div>

  <div id="mulCard" class="card">
    <h2>Daugyba stulpeliu</h2>
    <div class="controls">
      <select id="mulMode">
        <option value="3x2">3 skaitm. × 2 skaitm. (Sunkus)</option>
        <option value="2x2">2 skaitm. × 2 skaitm. (Vidutinis)</option>
        <option value="3x1">3 skaitm. × 1 skaitmuo (Lengvas)</option>
      </select>
    </div>
    <div id="multiplication" class="math math-column"></div>
  </div>

  <div class="actions">
    <button onclick="newTasks()">Nauji uždaviniai</button>
    <button class="primary" onclick="check()">Tikrinti</button>
    <button onclick="show()">Rodyti atsakymą</button>
  </div>

</div>

<script>
let division = {};
let multiplication = {};
let dirty = false;

function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generate() {
  // Division Generation
  const divMode = document.getElementById("divMode").value;
  let divisor = divMode === "1digit" ? rand(2, 9) : (divMode === "2digits" ? rand(10, 25) : rand(4, 15));
  const quotient = rand(20, 99);
  division = { divisor, dividend: divisor * quotient, quotient: quotient.toString() };

  // Multiplication Generation
  const mulMode = document.getElementById("mulMode").value;
  let a, b;
  if (mulMode === "3x1") { a = rand(100, 999); b = rand(2, 9); }
  else if (mulMode === "2x2") { a = rand(10, 99); b = rand(11, 99); }
  else { a = rand(100, 999); b = rand(11, 99); }
  
  multiplication = { a, b, result: (a * b).toString() };

  renderDivision();
  renderMultiplication();
  resetState();
}

function renderDivision() {
  const d = division;
  const el = document.getElementById("division");
  el.innerHTML = "";
  const divStr = d.dividend.toString();
  const sorStr = d.divisor.toString();

  const top = document.createElement("div");
  top.className = "row";
  top.appendChild(box("")); 
  divStr.split("").forEach(n => top.appendChild(box(n)));
  top.appendChild(vline());
  sorStr.split("").forEach(n => top.appendChild(box(n)));
  el.appendChild(top);

  const hRow = document.createElement("div");
  hRow.className = "row";
  for (let i = 0; i <= divStr.length; i++) hRow.appendChild(box("")); 
  const line = document.createElement("div");
  line.className = "div-hline";
  line.style.width = `calc(var(--cell) * ${Math.max(3, sorStr.length)})`;
  hRow.appendChild(line);
  el.appendChild(hRow);

  const qRow = document.createElement("div");
  qRow.className = "row";
  for (let i = 0; i <= divStr.length; i++) qRow.appendChild(box(""));
  d.quotient.split("").forEach((n, i) => {
    qRow.appendChild(inp("dq" + i, n, true));
  });
  el.appendChild(qRow);

  for (let r = 0; r < 4; r++) {
    const row = document.createElement("div");
    row.className = "row";
    row.appendChild(box(r % 2 === 0 ? "−" : "")); 
    for (let i = 0; i < divStr.length; i++) {
      row.appendChild(inp("ds" + r + "-" + i, "", false));
    }
    el.appendChild(row);
  }
}

function renderMultiplication() {
  const m = multiplication;
  const el = document.getElementById("multiplication");
  el.innerHTML = "";

  const aStr = m.a.toString();
  const bStr = m.b.toString();
  const resStr = m.result.toString();
  const isTwoRow = bStr.length > 1;
  const maxCols = resStr.length;

  // 1. Top Number
  const r1 = document.createElement("div");
  r1.className = "row";
  for (let i = 0; i < maxCols - aStr.length; i++) r1.appendChild(box(""));
  aStr.split("").forEach(n => r1.appendChild(box(n)));
  el.appendChild(r1);

  // 2. Bottom Number + Sign
  const r2 = document.createElement("div");
  r2.className = "row";
  for (let i = 0; i < maxCols - bStr.length - 1; i++) r2.appendChild(box(""));
  const sign = document.createElement("div");
  sign.className = "m-sign";
  sign.textContent = "×";
  r2.appendChild(sign);
  bStr.split("").forEach(n => r2.appendChild(box(n)));
  el.appendChild(r2);

  el.appendChild(mulHr(maxCols));

  if (isTwoRow) {
    // Partial Product 1
    const p1 = document.createElement("div");
    p1.className = "row";
    for (let i = 0; i < maxCols - 4; i++) p1.appendChild(box(""));
    for (let i = 0; i < 4; i++) p1.appendChild(inp("mp0-" + i, "", false));
    el.appendChild(p1);

    // Partial Product 2 + PLUS SIGN
    const p2 = document.createElement("div");
    p2.className = "row";
    for (let i = 0; i < maxCols - 6; i++) p2.appendChild(box(""));
    const plus = document.createElement("div");
    plus.className = "m-sign";
    plus.textContent = "+";
    p2.appendChild(plus);
    for (let i = 0; i < 4; i++) p2.appendChild(inp("mp1-" + i, "", false));
    p2.appendChild(box("")); 
    el.appendChild(p2);

    el.appendChild(mulHr(maxCols));
  }

  // Final Result
  const resRow = document.createElement("div");
  resRow.className = "row";
  resStr.split("").forEach((n, i) => {
    resRow.appendChild(inp("mr" + i, n, true));
  });
  el.appendChild(resRow);
}

function mulHr(cols) {
  const h = document.createElement("div");
  h.className = "row";
  const line = document.createElement("div");
  line.className = "mul-hline";
  line.style.width = `calc(var(--cell) * ${cols})`;
  h.appendChild(line);
  return h;
}

function box(t){ const d=document.createElement("div"); d.className="cell"; d.textContent=t; return d; }

function inp(id, ans, required) {
  const i = document.createElement("input");
  i.id = id;
  i.type = "text";
  i.inputMode = "numeric";
  i.maxLength = 1;
  i.dataset.ans = ans;
  if (required) i.dataset.required = "1";

  i.oninput = () => {
    dirty = true;
    if (i.value.length === 1) {
      const inputs = Array.from(document.querySelectorAll('input'));
      const index = inputs.indexOf(i);
      const isRightToLeft = id.includes("mp") || id.includes("mr");
      if (isRightToLeft) {
        const prevIndex = index - 1;
        if (prevIndex >= 0 && inputs[prevIndex].parentElement === i.parentElement) inputs[prevIndex].focus();
      } else {
        const nextIndex = index + 1;
        if (nextIndex < inputs.length && inputs[nextIndex].parentElement === i.parentElement) nextInput.focus();
      }
    }
  };

  i.onkeydown = (e) => {
    if (e.key === "Backspace" && i.value === "") {
      const inputs = Array.from(document.querySelectorAll('input'));
      const index = inputs.indexOf(i);
      const isRightToLeft = id.includes("mp") || id.includes("mr");
      if (isRightToLeft) {
        const nextIndex = index + 1;
        if (nextIndex < inputs.length && inputs[nextIndex].parentElement === i.parentElement) inputs[nextIndex].focus();
      } else {
        const prevIndex = index - 1;
        if (prevIndex >= 0 && inputs[prevIndex].parentElement === i.parentElement) inputs[prevIndex].focus();
      }
    }
  };
  return i;
}

function vline(){ const v=document.createElement("div"); v.className="vline"; return v; }

function check(){
  let divOk=true, mulOk=true;
  document.querySelectorAll("#division input[data-required]").forEach(i=>{ if(i.value!==i.dataset.ans) divOk=false; });
  document.querySelectorAll("#multiplication input[data-required]").forEach(i=>{ if(i.value!==i.dataset.ans) mulOk=false; });
  setCard("divCard", divOk); setCard("mulCard", mulOk);
  if(divOk && mulOk) dirty=false;
}

function setCard(id, ok){
  const c=document.getElementById(id);
  c.classList.remove("correct","incorrect");
  c.classList.add(ok?"correct":"incorrect");
}

function show(){
  document.querySelectorAll("input[data-ans]").forEach(i=>{ if(i.dataset.ans) i.value=i.dataset.ans; });
  dirty=false;
}

function newTasks(){
  if(dirty && !confirm("Ne visi uždaviniai išspręsti. Generuoti naujus?")) return;
  generate();
}

function resetState(){
  document.querySelectorAll(".card").forEach(c=>c.classList.remove("correct","incorrect"));
  dirty=false;
}

generate();
</script>
</body>
</html>
